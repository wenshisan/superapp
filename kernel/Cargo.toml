[package]
name = "cordis-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anymap2 = "0.13"
thiserror = "1"
anyhow = "1"

[dev-dependencies]
model-echo = { path = "../plugins/model-echo" }
tool-bash = { path = "../plugins/tool-bash" }

[lib]
name = "cordis_rs"
path = "src/lib.rs"
